name: Sync app-ads.txt

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the publisher's app-ads.txt
        run: |
          curl -fsSL --retry 3 https://loveplaygames.com/app-ads.txt -o app-ads.new
          lines=$(grep -c ', DIRECT\|, RESELLER' app-ads.new || true)
          if [ "$lines" -lt 50 ]; then
            echo "Only $lines seller lines fetched; keeping the current file."
            exit 1
          fi
          mv app-ads.new app-ads.txt

      - name: Commit if it changed
        run: |
          if git diff --quiet -- app-ads.txt; then
            echo "app-ads.txt is up to date."
            exit 0
          fi
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add app-ads.txt
          git commit -m "Sync app-ads.txt with loveplaygames.com"
          git push
